name: Build Jekyll Docs to /docs (main)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs-src/**'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: docs-src

      - name: Install dependencies
        working-directory: docs-src
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll (mounted at /docs)
        working-directory: docs-src
        run: |
          bundle exec jekyll build --baseurl "/docs" --destination ../_built-docs
          touch ../_built-docs/.nojekyll

      - name: Publish built site to /docs (on main)
        run: |
          rsync -av --delete _built-docs/ docs/
          # keep CNAME if you store it at repo root; if you keep one in /docs, preserve it:
          # [ -f docs/CNAME ] && cp docs/CNAME _built-docs/CNAME || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: build & publish Jekyll to /docs"
          file_pattern: docs/**